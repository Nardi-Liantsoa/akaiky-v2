apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Signature de release de l'app enfant (NAR-165) : keystore HORS du dépôt, décrit par
// un fichier de propriétés (storeFile, storePassword, keyAlias, keyPassword).
// Chemin : AKAIKY_KEYSTORE_PROPERTIES, sinon ~/.config/akaiky-v2/keystore.properties.
// Absent (CI, autre poste) : la release enfant n'est pas signée, le debug est inchangé.
def keystoreProperties = new Properties()
def keystoreFile = file(System.getenv('AKAIKY_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/.config/akaiky-v2/keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProperties.load(it) }
// storeFile : « ~ » développé ; un chemin relatif se lit depuis le dossier du fichier de propriétés.
def keystorePath = { String p ->
  def expanded = p.startsWith('~/') ? System.getProperty('user.home') + p.substring(1) : p
  def f = new File(expanded)
  f.absolute ? f : new File(keystoreFile.parentFile, expanded)
}
// Jamais d'APK enfant de release non signé : sans keystore, la tâche échoue.
gradle.taskGraph.whenReady { graph ->
  def packaging = ['assembleEnfantRelease', 'bundleEnfantRelease', 'packageEnfantRelease', 'installEnfantRelease']
  if (!keystoreProperties['storeFile'] && graph.allTasks.any { it.name in packaging }) {
    throw new GradleException("Release enfant sans keystore : AKAIKY_KEYSTORE_PROPERTIES ou ${keystoreFile} (NOSYHOST.md § 6)")
  }
}

android {
    namespace = "mg.nosytech.akaiky"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId = "mg.nosytech.akaiky"
        // minSdk 26 : valeur de variables.gradle (minSdkVersion), lue par cap sync.
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // Ex-aaptOptions (supprimé par AGP 9, NAR-163) : même motif, même effet.
    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    // Deux applications, une base de code (CLAUDE.md, « Décisions ») :
    //  - parent : Play Store (et App Store pour iOS) ;
    //  - enfant : Android seul, installée par le QR d'appairage (Device Owner, NAR-138/139).
    // Identifiants définitifs une fois publiés. Nom affiché : src/<variante>/res/values/strings.xml.
    signingConfigs {
        if (keystoreProperties['storeFile']) {
            enfantRelease {
                storeFile = keystorePath(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }
    flavorDimensions = ['app']
    productFlavors {
        parent {
            dimension = 'app'
        }
        enfant {
            dimension = 'app'
            // mg.nosytech.akaiky.enfant : CHILD_APP_ID de src/lib/appKind.ts.
            applicationIdSuffix = '.enfant'
            // Versions propres à l'app enfant (mises à jour par APK, hors Play Store) :
            // à monter à chaque publication, sinon Android refuse la mise à jour.
            versionCode = 1
            versionName = '1.0'
            // Release seulement : le type debug garde sa propre signature de debug.
            if (keystoreProperties['storeFile']) signingConfig = signingConfigs.enfantRelease
        }
    }
    // BuildConfig.FLAVOR : MainActivity n'enregistre le greffon d'appel que dans l'app enfant.
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            // Sans effet tant que minifyEnabled = false (ni R8 ni règles appliqués) ; AGP 9 refuse
            // proguard-android.txt, d'où la version -optimize (NAR-163).
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Identité OTA propre à chaque coque (NAR-162). Les deux variantes partagent le
// capacitor.config.json écrit par `cap sync` (appId racine mg.nosytech.akaiky) : sans cela,
// le greffon CapacitorUpdater de l'app enfant se présenterait au serveur OTA comme l'app
// parent. Les assets fusionnés de chaque variante reçoivent donc, nativement et jamais par le
// bundle web : appId = applicationId de la variante, canal par défaut = nom de la variante,
// canal et appId non modifiables depuis le JavaScript, statistiques Capgo coupées (statsUrl
// vide). Échec du build si l'identité écrite ne correspond pas
// à la règle de src/lib/appKind.ts (préfixe de l'app enfant), ou si le bloc CapacitorUpdater manque.
// Serveur OTA (NAR-190) : updateUrl et channelUrl (écrits par `cap sync` depuis capacitor.config.ts)
// doivent viser la même origine, sur les chemins du serveur Akaiky, jamais Capgo ; release : https
// (et, avant l'empaquetage, jamais l'adresse provisoire .invalid : OtaReleaseGuardTask) ; debug :
// https ou http://127.0.0.1:<port>, seul hôte en clair de la coque debug.
// L'origine doit être celle de l'API compilée dans le bundle embarqué (« <origine>/api » fermé par
// un délimiteur de chaîne dans ses scripts) : un `cap sync` et un `vite build` faits avec deux origines échouent ici. Le
// JavaScript ne peut ni les changer ni en garder d'autres (allowModifyUrl, persistModifyUrl,
// allowPreview forcés à false, localApi retiré).
// Vérifié par OtaIdentityTest.kt contre tests/fixtures/ota-target-cases.json.
abstract class OtaIdentityTask extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getInputAssets()
    @OutputDirectory abstract DirectoryProperty getOutputAssets()
    @Input abstract Property<String> getAppId()
    @Input abstract Property<String> getChannel()
    @Input abstract Property<Boolean> getRelease()
    // Opérations sur fichiers injectées (pas de Task.project à l'exécution : cache de configuration).
    @javax.inject.Inject abstract FileSystemOperations getFs()

    @TaskAction
    void write() {
        def out = outputAssets.get().asFile
        fs.delete { delete out }
        fs.copy { from inputAssets; into out }
        def file = new File(out, 'capacitor.config.json')
        if (!file.exists()) throw new GradleException("capacitor.config.json absent des assets : lancer npx cap sync android")
        def id = appId.get()
        def kind = (id == 'mg.nosytech.akaiky.enfant' || id.startsWith('mg.nosytech.akaiky.enfant.')) ? 'enfant' : 'parent'
        if (kind != channel.get()) throw new GradleException("Variante ${channel.get()} avec l'identifiant ${id} (app ${kind}) : canal OTA incohérent")
        // Forme attendue, sinon échec : un bloc absent laisserait le greffon à ses défauts
        // (autoUpdate actif, statistiques vers plugin.capgo.app).
        def config = new groovy.json.JsonSlurper().parse(file)
        def updater = (config instanceof Map && config.plugins instanceof Map) ? config.plugins.CapacitorUpdater : null
        if (!(updater instanceof Map)) throw new GradleException("plugins.CapacitorUpdater absent ou mal formé dans capacitor.config.json (capacitor.config.ts, npx cap sync android)")
        updater.appId = id
        updater.defaultChannel = channel.get()
        updater.allowSetDefaultChannel = false
        updater.allowModifyAppId = false
        updater.statsUrl = ''
        def origin = otaOrigin(updater, release.get())
        def bundle = new File(out, 'public/assets')
        def scripts = bundle.isDirectory() ? bundle.listFiles().findAll { it.name.endsWith('.js') } : []
        // API_BASE (src/api/base.ts) compilée telle quelle : « <origine>/api » fermé par un délimiteur
        // de chaîne ; l'updateUrl du bundle (« <origine>/api/ota/latest ») ne compte pas.
        def apis = ['`', '"', "'"].collect { "${origin}/api${it}".toString() }
        if (!scripts.any { f -> def t = f.text; apis.any { t.contains(it) } }) {
            throw new GradleException("Le bundle embarqué n'appelle pas l'API ${origin} du serveur OTA : refaire `npm run build` puis `npx cap sync android` avec le même VITE_API_ORIGIN")
        }
        updater.allowModifyUrl = false
        updater.persistModifyUrl = false
        updater.allowPreview = false
        updater.allowHttpsToHttpRedirect = false
        updater.httpsOnly = origin.startsWith('https://')
        updater.remove('localApi')
        updater.remove('localApiFiles')
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
    }

    // Origine commune de updateUrl et channelUrl, sinon échec du build.
    static String otaOrigin(Map updater, boolean release) {
        def update = updater.updateUrl, channel = updater.channelUrl
        if (!(update instanceof String) || !(channel instanceof String)) {
            throw new GradleException("updateUrl ou channelUrl absent de CapacitorUpdater : le greffon viserait Capgo Cloud (capacitor.config.ts, npx cap sync android)")
        }
        def m = (update =~ /^(https:\/\/[a-z0-9.-]+(?::\d+)?|http:\/\/127\.0\.0\.1:\d+)\/api\/ota\/latest$/)
        if (!m.matches()) throw new GradleException("updateUrl inattendue : ${update} (https://<hôte>/api/ota/latest)")
        String origin = m.group(1)
        if (channel != "${origin}/api/ota/channel".toString()) throw new GradleException("channelUrl ${channel} : attendue ${origin}/api/ota/channel")
        def host = new URI(origin).host.toLowerCase()
        if (host == 'capgo.app' || host.endsWith('.capgo.app')) throw new GradleException("Le serveur OTA ne peut pas être Capgo Cloud")
        if (release && !origin.startsWith('https://')) throw new GradleException("Build release : serveur OTA en https seulement (${origin})")
        return origin
    }
}

// Release empaquetée (APK, AAB) : jamais l'adresse provisoire (.invalid) : une coque publiée ne
// recevrait aucune mise à jour et n'atteindrait pas l'API. Contrôlé avant l'empaquetage seulement :
// les tests JVM des variantes release passent avec l'adresse provisoire (NAR-190).
abstract class OtaReleaseGuardTask extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getAssets()

    @TaskAction
    void check() {
        def config = new groovy.json.JsonSlurper().parse(new File(assets.get().asFile, 'capacitor.config.json'))
        def host = new URI(config.plugins.CapacitorUpdater.updateUrl).host
        if (host.endsWith('.invalid')) {
            throw new GradleException("Release avec l'adresse provisoire ${host} : fixer VITE_API_ORIGIN (domaine de production) avant `npm run build` et `npx cap sync`")
        }
    }
}

// Même cible que le Java de Capacitor (capacitor.build.gradle : VERSION_21). Ex-kotlinOptions
// (DSL déprécié par Kotlin 2.x, absent du Kotlin intégré d'AGP 9) : compilerOptions (NAR-163).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def name = variant.name.capitalize()
        def task = project.tasks.register("otaIdentity${name}", OtaIdentityTask) {
            appId.set(variant.applicationId)
            channel.set(variant.flavorName)
            release.set(variant.buildType != 'debug')
        }
        variant.artifacts.use(task)
            .wiredWithDirectories({ it.inputAssets }, { it.outputAssets })
            .toTransform(com.android.build.api.artifact.SingleArtifact.ASSETS.INSTANCE)
        if (variant.buildType != 'debug') {
            def guard = project.tasks.register("otaReleaseGuard${name}", OtaReleaseGuardTask) {
                assets.set(task.flatMap { it.outputAssets })
                outputs.upToDateWhen { false }
            }
            project.tasks.matching { it.name == "package${name}" || it.name == "package${name}Bundle" }.configureEach { it.dependsOn(guard) }
        }
        // Le test JVM lit les assets que la variante embarque réellement, et les cas partagés.
        def fixture = rootProject.file('../tests/fixtures/ota-target-cases.json')
        project.tasks.matching { it.name == "test${name}UnitTest" }.configureEach { t ->
            t.inputs.dir(task.flatMap { it.outputAssets })
            t.inputs.file(fixture)
            t.systemProperty 'akaiky.assets', task.get().outputAssets.get().asFile.absolutePath
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Signal de vie en arrière-plan de l'app enfant (NAR-180) : absent de l'app parent.
    enfantImplementation "androidx.work:work-runtime:2.10.5"
    testImplementation "junit:junit:$junitVersion"
    // Tests JVM seulement : vrai org.json (celui d'Android n'y est qu'un bouchon), pour lire
    // les plages et les cas partagés avec l'écran (NAR-176). Absent de l'APK.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
