apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Signature de release de l'app enfant (NAR-165) : keystore HORS du dépôt, décrit par
// un fichier de propriétés (storeFile, storePassword, keyAlias, keyPassword).
// Chemin : AKAIKY_KEYSTORE_PROPERTIES, sinon ~/.config/akaiky-v2/keystore.properties.
// Absent (CI, autre poste) : la release enfant n'est pas signée, le debug est inchangé.
def keystoreProperties = new Properties()
def keystoreFile = file(System.getenv('AKAIKY_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/.config/akaiky-v2/keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProperties.load(it) }
// storeFile : « ~ » développé ; un chemin relatif se lit depuis le dossier du fichier de propriétés.
def keystorePath = { String p ->
  def expanded = p.startsWith('~/') ? System.getProperty('user.home') + p.substring(1) : p
  def f = new File(expanded)
  f.absolute ? f : new File(keystoreFile.parentFile, expanded)
}
// Jamais d'APK enfant de release non signé : sans keystore, la tâche échoue.
gradle.taskGraph.whenReady { graph ->
  def packaging = ['assembleEnfantRelease', 'bundleEnfantRelease', 'packageEnfantRelease', 'installEnfantRelease']
  if (!keystoreProperties['storeFile'] && graph.allTasks.any { it.name in packaging }) {
    throw new GradleException("Release enfant sans keystore : AKAIKY_KEYSTORE_PROPERTIES ou ${keystoreFile} (NOSYHOST.md § 6)")
  }
}

android {
    namespace = "mg.nosytech.akaiky"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "mg.nosytech.akaiky"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Deux applications, une base de code (CLAUDE.md, « Décisions ») :
    //  - parent : Play Store (et App Store pour iOS) ;
    //  - enfant : Android seul, installée par le QR d'appairage (Device Owner, NAR-138/139).
    // Identifiants définitifs une fois publiés. Nom affiché : src/<variante>/res/values/strings.xml.
    signingConfigs {
        if (keystoreProperties['storeFile']) {
            enfantRelease {
                storeFile keystorePath(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    flavorDimensions = ['app']
    productFlavors {
        parent {
            dimension 'app'
        }
        enfant {
            dimension 'app'
            // mg.nosytech.akaiky.enfant : CHILD_APP_ID de src/lib/appKind.ts.
            applicationIdSuffix '.enfant'
            // Versions propres à l'app enfant (mises à jour par APK, hors Play Store) :
            // à monter à chaque publication, sinon Android refuse la mise à jour.
            versionCode 1
            versionName '1.0'
            // Release seulement : le type debug garde sa propre signature de debug.
            if (keystoreProperties['storeFile']) signingConfig signingConfigs.enfantRelease
        }
    }
    // Même cible que le Java de Capacitor (capacitor.build.gradle : VERSION_21).
    kotlinOptions {
        jvmTarget = '21'
    }
    // BuildConfig.FLAVOR : MainActivity n'enregistre le greffon d'appel que dans l'app enfant.
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Identité OTA propre à chaque coque (NAR-162). Les deux variantes partagent le
// capacitor.config.json écrit par `cap sync` (appId racine mg.nosytech.akaiky) : sans cela,
// le greffon CapacitorUpdater de l'app enfant se présenterait au serveur OTA comme l'app
// parent. Les assets fusionnés de chaque variante reçoivent donc, nativement et jamais par le
// bundle web : appId = applicationId de la variante, canal par défaut = nom de la variante,
// canal et appId non modifiables depuis le JavaScript, statistiques Capgo coupées (statsUrl
// vide). Échec du build si l'identité écrite ne correspond pas
// à la règle de src/lib/appKind.ts (préfixe de l'app enfant), ou si le bloc CapacitorUpdater manque.
// Vérifié par OtaIdentityTest.kt contre tests/fixtures/ota-target-cases.json.
abstract class OtaIdentityTask extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getInputAssets()
    @OutputDirectory abstract DirectoryProperty getOutputAssets()
    @Input abstract Property<String> getAppId()
    @Input abstract Property<String> getChannel()
    // Opérations sur fichiers injectées (pas de Task.project à l'exécution : cache de configuration).
    @javax.inject.Inject abstract FileSystemOperations getFs()

    @TaskAction
    void write() {
        def out = outputAssets.get().asFile
        fs.delete { delete out }
        fs.copy { from inputAssets; into out }
        def file = new File(out, 'capacitor.config.json')
        if (!file.exists()) throw new GradleException("capacitor.config.json absent des assets : lancer npx cap sync android")
        def id = appId.get()
        def kind = (id == 'mg.nosytech.akaiky.enfant' || id.startsWith('mg.nosytech.akaiky.enfant.')) ? 'enfant' : 'parent'
        if (kind != channel.get()) throw new GradleException("Variante ${channel.get()} avec l'identifiant ${id} (app ${kind}) : canal OTA incohérent")
        // Forme attendue, sinon échec : un bloc absent laisserait le greffon à ses défauts
        // (autoUpdate actif, statistiques vers plugin.capgo.app).
        def config = new groovy.json.JsonSlurper().parse(file)
        def updater = (config instanceof Map && config.plugins instanceof Map) ? config.plugins.CapacitorUpdater : null
        if (!(updater instanceof Map)) throw new GradleException("plugins.CapacitorUpdater absent ou mal formé dans capacitor.config.json (capacitor.config.ts, npx cap sync android)")
        updater.appId = id
        updater.defaultChannel = channel.get()
        updater.allowSetDefaultChannel = false
        updater.allowModifyAppId = false
        updater.statsUrl = ''
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def name = variant.name.capitalize()
        def task = project.tasks.register("otaIdentity${name}", OtaIdentityTask) {
            appId.set(variant.applicationId)
            channel.set(variant.flavorName)
        }
        variant.artifacts.use(task)
            .wiredWithDirectories({ it.inputAssets }, { it.outputAssets })
            .toTransform(com.android.build.api.artifact.SingleArtifact.ASSETS.INSTANCE)
        // Le test JVM lit les assets que la variante embarque réellement, et les cas partagés.
        def fixture = rootProject.file('../tests/fixtures/ota-target-cases.json')
        project.tasks.matching { it.name == "test${name}UnitTest" }.configureEach { t ->
            t.inputs.dir(task.flatMap { it.outputAssets })
            t.inputs.file(fixture)
            t.systemProperty 'akaiky.assets', task.get().outputAssets.get().asFile.absolutePath
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Signal de vie en arrière-plan de l'app enfant (NAR-180) : absent de l'app parent.
    enfantImplementation "androidx.work:work-runtime:2.10.5"
    testImplementation "junit:junit:$junitVersion"
    // Tests JVM seulement : vrai org.json (celui d'Android n'y est qu'un bouchon), pour lire
    // les plages et les cas partagés avec l'écran (NAR-176). Absent de l'APK.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
